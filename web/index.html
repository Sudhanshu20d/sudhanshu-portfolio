<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sudhanshu Singh — Flutter Developer • Mobile App Developer. Handcrafted production mobile applications. Vapi, Gujarat, India.">
  <meta name="theme-color" content="#09090B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sudhanshu Singh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sudhanshu Singh — Flutter Developer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background-color: #09090B;
      height: 100%;
    }
    body {
      background-color: #09090B;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #09090B;
      z-index: 999999;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .monogram-box {
      width: 80px;
      height: 80px;
      min-width: 80px;
      min-height: 80px;
      max-width: 80px;
      max-height: 80px;
      flex-shrink: 0;
      background-color: #14141A;
      border-radius: 18px;
      border: 1.5px solid rgba(168, 140, 255, 0.65);
      box-shadow: 0 0 24px rgba(168, 140, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #F6F4EF;
      font-family: 'IBM Plex Mono', 'SF Mono', Monaco, Menlo, Consolas, monospace;
      font-size: 28px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      white-space: nowrap;
      animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (min-width: 768px) {
      .monogram-box {
        width: 88px;
        height: 88px;
        min-width: 88px;
        min-height: 88px;
        max-width: 88px;
        max-height: 88px;
        border-radius: 20px;
        border: 1.5px solid rgba(168, 140, 255, 0.75);
        box-shadow: 0 0 32px rgba(168, 140, 255, 0.4);
        font-size: 32px;
      }
    }
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.75;
        transform: scale(0.96);
      }
    }
  </style>
  <script>
    // Failsafe listener for flutter first frame
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-screen');
      if (loader && !loader.classList.contains('fade-out')) {
        loader.classList.add('fade-out');
        setTimeout(function() {
          loader.remove();
        }, 400);
      }
    });
  </script>
</head>
<body style="background-color: #09090B;">
  <div id="loading-screen">
    <div class="monogram-box">SD</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
