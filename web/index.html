<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sudhanshu Singh — Flutter Developer • Mobile App Developer. Handcrafted production mobile applications. Vapi, Gujarat, India.">
  <meta name="theme-color" content="#09090A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sudhanshu Singh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sudhanshu Singh — Flutter Developer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background-color: #09090A;
      height: 100%;
    }
    body {
      background-color: #09090A;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #09090A;
      z-index: 999999;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .brand-intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .brand-monogram {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 56px;
      font-weight: 700;
      color: #F3F1EB;
      line-height: 1;
      letter-spacing: -2px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 0 22px 0;
    }
    .letter-s {
      display: inline-block;
      opacity: 0;
      transform: translateY(6px);
      animation: revealS 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
    }
    .letter-d {
      display: inline-block;
      opacity: 0;
      transform: translateX(8px);
      animation: revealD 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
    }
    @keyframes revealS {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes revealD {
      from {
        opacity: 0;
        transform: translateX(8px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .brand-line-track {
      width: 72px;
      height: 1px;
      background-color: rgba(255, 255, 255, 0.06);
      position: relative;
      overflow: hidden;
      margin: 0;
    }
    .brand-line-fill {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #D2F832;
      transform-origin: left;
      transform: scaleX(0);
      animation: fillLine 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.4s forwards;
    }
    @keyframes fillLine {
      from {
        transform: scaleX(0);
      }
      to {
        transform: scaleX(1);
      }
    }
    @media (min-width: 768px) {
      .brand-monogram {
        font-size: 68px;
        letter-spacing: -2.5px;
        margin-bottom: 26px;
      }
      .brand-line-track {
        width: 88px;
      }
    }
  </style>
  <script>
    window.animationDone = false;
    window.flutterAppReady = false;

    function checkFadeOut() {
      if (window.animationDone && window.flutterAppReady) {
        var loader = document.getElementById('loading-screen');
        if (loader && !loader.classList.contains('fade-out')) {
          loader.classList.add('fade-out');
          setTimeout(function() {
            if (loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 400);
        }
      }
    }

    // Reveal and fill animation completes at ~1000ms
    setTimeout(function() {
      window.animationDone = true;
      checkFadeOut();
    }, 1000);

    // Flutter readiness hooks
    window.notifyFlutterReady = function() {
      window.flutterAppReady = true;
      checkFadeOut();
    };

    window.addEventListener('flutter-first-frame', function() {
      window.flutterAppReady = true;
      checkFadeOut();
    });

    // Failsafe timeout so the loader never remains stuck indefinitely
    setTimeout(function() {
      window.animationDone = true;
      window.flutterAppReady = true;
      checkFadeOut();
    }, 4500);
  </script>
</head>
<body style="background-color: #09090A;">
  <div id="loading-screen">
    <div class="brand-intro">
      <div class="brand-monogram">
        <span class="letter-s">S</span><span class="letter-d">D</span>
      </div>
      <div class="brand-line-track">
        <div class="brand-line-fill"></div>
      </div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
