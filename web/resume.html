<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sudhanshu Singh — Resume</title>
  <style>
    :root{color-scheme:dark light;--bg:#0b0b0c;--text:#ededed;--line:#222225;--accent:#ff4b1f}
    @media(prefers-color-scheme:light){:root{--bg:#efefec;--text:#0b0b0c;--line:#ccc}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
    header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));background:var(--bg);border-bottom:1px solid var(--line)}
    h1{font-size:16px;margin:0}nav{display:flex;gap:16px;flex-wrap:wrap}a{color:var(--text);font-size:12px;text-underline-offset:5px}a:hover{color:var(--accent)}a:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
    #status{text-align:center;padding:20px}main{max-width:960px;padding:24px 12px max(24px,env(safe-area-inset-bottom));margin:auto}.page{position:relative;margin:0 auto 24px;background:white;box-shadow:0 5px 30px #0003;overflow:hidden}canvas{display:block;width:100%;height:auto}.pdf-link{position:absolute;display:block;background:transparent}
    @media(max-width:480px){header{align-items:flex-start;flex-direction:column;gap:12px}main{padding:16px 8px}}
  </style>
</head>
<body>
  <header><h1>Sudhanshu Singh — Resume</h1><nav aria-label="Resume actions"><a href="./">Portfolio</a><a href="resume.pdf" download="Sudhanshu_Singh_Flutter_Developer_Resume.pdf">Download PDF ↗</a></nav></header>
  <p id="status" role="status">Loading your resume…</p>
  <main id="pages" aria-label="Resume PDF pages"></main>
  <script type="module">
    import {getDocument, GlobalWorkerOptions} from './pdfjs/pdf.js';
    GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.js';
    const status = document.getElementById('status');
    const pages = document.getElementById('pages');
    try {
      // Rendering the original PDF avoids browser PDF-plugin and MIME differences.
      const pdf = await getDocument({url:'./resume.pdf',isEvalSupported:false}).promise;
      for(let number=1;number<=pdf.numPages;number++) {
        const page=await pdf.getPage(number);
        const viewport=page.getViewport({scale:1});
        const width=Math.min(pages.clientWidth-24,900);
        const scale=width/viewport.width;
        const pixelRatio=Math.min(devicePixelRatio||1,2);
        const rendered=page.getViewport({scale:scale*pixelRatio});
        const section=document.createElement('section');section.className='page';section.style.maxWidth=width+'px';
        const canvas=document.createElement('canvas');canvas.width=Math.ceil(rendered.width);canvas.height=Math.ceil(rendered.height);canvas.setAttribute('role','img');canvas.setAttribute('aria-label',`Resume page ${number} of ${pdf.numPages}`);
        section.append(canvas);pages.append(section);
        await page.render({canvasContext:canvas.getContext('2d'),viewport:rendered}).promise;
        const content=await page.getTextContent();
        canvas.setAttribute('aria-label',`Resume page ${number}. `+content.items.map(item=>item.str||'').join(' '));
        const cssViewport=page.getViewport({scale});
        for(const annotation of await page.getAnnotations()) {
          if(!annotation.url || !/^(https?:|mailto:|tel:)/i.test(annotation.url)) continue;
          const rect=cssViewport.convertToViewportRectangle(annotation.rect);
          const link=document.createElement('a');link.className='pdf-link';link.href=annotation.url;link.target='_blank';link.rel='noopener noreferrer';link.setAttribute('aria-label',annotation.url);
          Object.assign(link.style,{left:Math.min(rect[0],rect[2])/cssViewport.width*100+'%',top:Math.min(rect[1],rect[3])/cssViewport.height*100+'%',width:Math.abs(rect[2]-rect[0])/cssViewport.width*100+'%',height:Math.abs(rect[3]-rect[1])/cssViewport.height*100+'%'});
          section.append(link);
        }
      }
      status.hidden=true;
      document.documentElement.dataset.resumeReady='true';
    } catch(error) {
      status.textContent='The preview could not load. Use Download PDF above to open your original resume.';
      console.error(error);
    }
  </script>
</body>
</html>
